name: Reset live demo

# Wipes whatever visitors typed into the public demo and reseeds it. Runs
# weekly and on demand. It does nothing until the DEMO_DATABASE_URL and
# DEMO_WORKSPACE_ID repository secrets exist, so it is safe to merge first.
#
# Only this schedule and manual dispatch can trigger it, never a pull request,
# so forked PRs can never reach the secrets. The script itself refuses to touch
# any workspace whose slug does not start with "demo-".
on:
  schedule:
    - cron: "0 19 * * 0" # Sunday 19:00 UTC, which is Monday 03:00 in Malaysia
  workflow_dispatch:

concurrency:
  group: reset-demo
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      TANDEM_WORKSPACE_ID: ${{ secrets.DEMO_WORKSPACE_ID }}
    steps:
      - name: Skip if the demo secrets are not configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$TANDEM_WORKSPACE_ID" ]; then
            echo "DEMO_DATABASE_URL / DEMO_WORKSPACE_ID not set; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npm run build
        if: steps.gate.outputs.run == 'true'
      - run: node scripts/reset-demo-workspace.mjs --confirm "$TANDEM_WORKSPACE_ID"
        if: steps.gate.outputs.run == 'true'
