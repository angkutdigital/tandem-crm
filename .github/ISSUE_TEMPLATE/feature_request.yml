name: Feature request
description: Suggest something Tandem should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the use case first, before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Tandem to do?
      description: If you have an idea of the API or behavior, sketch it here.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
      description: Workarounds, or other tools you looked at.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help build it?
      options:
        - "Yes, I would like to send a pull request"
        - "Maybe, with some guidance"
        - "No, I am only suggesting it"
    validations:
      required: true
